version: '3.8'

services:
  backend:
    image: phat1008/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=RI=mongodb+srv://admin_user:168322@cluster0.ggxjxsw.mongodb.net/cloud_lab?appName=Cluster0
      - PORT=5000
    restart: always

  frontend:
    image: phat1008/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always